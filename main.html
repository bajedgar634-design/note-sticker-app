<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Менеджер заметок</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Боковая панель -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1><i class="fas fa-sticky-note"></i> Заметки</h1>
                <button class="add-note-btn" id="addNoteBtn">
                    <i class="fas fa-plus"></i> Новая заметка
                </button>
            </div>

            <!-- Поиск -->
            <div class="search-box">
                <i class="fas fa-search search-icon"></i>
                <input type="text" id="searchInput" placeholder="Поиск заметок...">
            </div>

            <!-- Список заметок -->
            <div class="notes-list" id="notesList">
                <!-- Заметки будут загружаться сюда -->
            </div>

            <!-- Статистика -->
            <div class="sidebar-footer">
                <div class="stats">
                    <span>Всего заметок: <span id="totalNotes">0</span></span>
                </div>
            </div>
        </aside>

        <!-- Основная область -->
        <main class="main-content">
            <div class="note-editor" id="noteEditor" style="display: none;">
                <div class="editor-header">
                    <input type="text" id="noteTitle" placeholder="Заголовок заметки" class="note-title-input">
                    <div class="editor-actions">
                        <button class="btn-save" id="saveNoteBtn">
                            <i class="fas fa-save"></i> Сохранить
                        </button>
                        <button class="btn-delete" id="deleteNoteBtn">
                            <i class="fas fa-trash"></i> Удалить
                        </button>
                    </div>
                </div>

                <div class="note-meta">
                    <span id="noteDate"></span>
                    <span class="word-count" id="wordCount">0 слов</span>
                </div>

                <textarea id="noteContent" placeholder="Введите текст заметки..." class="note-content-input"></textarea>
            </div>

            <div class="empty-state" id="emptyState">
                <i class="fas fa-sticky-note empty-icon"></i>
                <h2>Добро пожаловать в Менеджер заметок!</h2>
                <p>Создайте свою первую заметку, нажав на кнопку "Новая заметка"</p>
                <button class="add-note-btn empty-btn" id="emptyStateBtn">
                    <i class="fas fa-plus"></i> Создать заметку
                </button>
            </div>
        </main>
    </div>

    <!-- Модальное окно подтверждения удаления -->
    <div class="modal" id="deleteModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fas fa-exclamation-triangle"></i> Подтверждение удаления</h3>
                <button class="modal-close" id="closeModalBtn">&times;</button>
            </div>
            <div class="modal-body">
                <p>Вы уверены, что хотите удалить заметку "<span id="deleteNoteTitle"></span>"?</p>
                <p class="warning-text">Это действие нельзя отменить.</p>
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" id="cancelDeleteBtn">Отмена</button>
                <button class="btn-delete-confirm" id="confirmDeleteBtn">Удалить</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
